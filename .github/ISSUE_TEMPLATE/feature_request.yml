name: 改进建议
description: 说明你要解决的业务问题
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景及目前遇到的限制，不附客户或员工隐私。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的处理方法
